version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kanban_tasks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban_user
      POSTGRES_PASSWORD: kanban_secure_password
      POSTGRES_DB: kanban_tasks_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
